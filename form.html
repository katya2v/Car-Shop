<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./asset/css/FormStyle.css">

    <title>Document</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a class="link" href="index.html">Main</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <form>
            <fieldset>
            <legent>
                <h3>Personal info</h3>
                <label>First Name <input type="text" name="fname"></label>
                <label>Last Name <input type="text" name="lname"></label>
                <label>Birthday <input type="date" name="bday"></label>
                <label>Gender:
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </label>
                <label>Drive experience
                    <select name="experience">
                        <option>--</option>
                        <option>expert</option>
                        <option>more than 10</option>
                        <option>5-10</option>
                        <option>2-5</option>
                        <option>less than 2</option>
                        <option>beginner</option>
                    </select>
                </label>
            </legent>
            </fieldset>

            <fieldset>
            <legent>
                <h3>Contacts</h3>
                <label>Email <input type="email" name="email"></label>
                <label>Phone <input type="tel" name="phone"></label>
                <label>Address <input type="text" name="address"></label>
            </legent>
            </fieldset>

            <fieldset>
            <legent>
                <h3>Car info</h3>
                <label>Brand <select name="brand">
                        <option>Ford</option>
                        <option>Toyota</option>
                        <option>BMW</option>
                    </select></label>
                <label>Model <input type="text" name="model"></label>
                <label><input type="checkbox" name="used"> Used</label>

                <label id="color">Color:
                    <input type="radio" id="red" name="color" value="red">
                    <label for="red"> Red</label>

                    <input type="radio" id="black" name="color" value="black">
                    <label for="black"> Black</label>

                    <input type="radio" id="blue" name="color" value="blue">
                    <label for="blue"> Blue</label>

                    <input type="radio" id="white" name="color" value="white">
                    <label for="white"> White</label>

                    <input type="radio" id="grey" name="color" value="grey">
                    <label for="grey"> Grey</label>
                </label>
                <label for="price">Price:</label>
                <input type="range" id="price" name="price" min="10" max="80" step="10" value="40">
                <div class="ticks">
                    <option>10</option>
                    <option>20</option>
                    <option>30</option>
                    <option>40</option>
                    <option>50</option>
                    <option>60</option>
                    <option>70</option>
                    <option>80</option>
                </div>
            </legent>
            </fieldset>

            <div class="buttons">
                <button type="reset">Cancel</button>
                <button type="submit">Ok</button>
            </div>
        </form>
    </main>
</body>

</html>
